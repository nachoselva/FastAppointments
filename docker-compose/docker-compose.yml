services:
  appointments.api:
    build:
      context: ../
      dockerfile: src/Payments/Payments.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      sql-init-payments:
        condition: service_completed_successfully

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQLSERVER_SA_PASSWORD}
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$SQLSERVER_SA_PASSWORD" -Q "SELECT 1" -C || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
     

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  sql-init-payments:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U SA -P '${SQLSERVER_SA_PASSWORD}' -i /migrations/init_db.sql -v DB_NAME='${PAYMENTS_DB_NAME}' -v MIGRATOR_USER='${PAYMENTS_USER_MIGRATOR}' -v MIGRATOR_PASSWORD='${PAYMENTS_PASSWORD_MIGRATOR}' -v APPLICATION_USER='${PAYMENTS_USER_APPLICATION}' -v APPLICATION_PASSWORD='${PAYMENTS_PASSWORD_APPLICATION}' -C"