networks:
  internal:
    driver: bridge  

services: 
  gateway.api:
    build:
        context: ../
        dockerfile: src/Gateway/Gateway.Api/Dockerfile
    ports:
        - "5000:8080"
    environment:
        - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    networks:
      - internal 
        
  appointments.api:
    build:
      context: ../
      dockerfile: src/Appointments/Appointments.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      sql-init-appointments:
        condition: service_completed_successfully
    networks:
      - internal

  payments.api:
    build:
      context: ../
      dockerfile: src/Payments/Payments.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      sql-init-payments:
        condition: service_completed_successfully
    networks:
      - internal

  setups.api:
    build:
      context: ../
      dockerfile: src/Setups/Setups.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      sql-init-setups:
        condition: service_completed_successfully
    networks:
      - internal

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQLSERVER_SA_PASSWORD}
    ports:
      - "1434:1433"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$SQLSERVER_SA_PASSWORD" -Q "SELECT 1" -C || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
     

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - internal

  sql-init-payments:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    networks:
      - internal
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U SA -P '${SQLSERVER_SA_PASSWORD}' -i /migrations/init_db.sql -v DB_NAME='${PAYMENTS_DB_NAME}' -v MIGRATOR_USER='${PAYMENTS_USER_MIGRATOR}' -v MIGRATOR_PASSWORD='${PAYMENTS_PASSWORD_MIGRATOR}' -v APPLICATION_USER='${PAYMENTS_USER_APPLICATION}' -v APPLICATION_PASSWORD='${PAYMENTS_PASSWORD_APPLICATION}' -C"

  sql-init-appointments:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
        sqlserver:
            condition: service_healthy
    volumes:
        - ./migrations:/migrations
    networks:
        - internal
    command: >
        /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U SA -P '${SQLSERVER_SA_PASSWORD}' -i /migrations/init_db.sql -v DB_NAME='${APPOINTMENTS_DB_NAME}' -v MIGRATOR_USER='${APPOINTMENTS_USER_MIGRATOR}' -v MIGRATOR_PASSWORD='${APPOINTMENTS_PASSWORD_MIGRATOR}' -v APPLICATION_USER='${APPOINTMENTS_USER_APPLICATION}' -v APPLICATION_PASSWORD='${APPOINTMENTS_PASSWORD_APPLICATION}' -C"

  sql-init-setups:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
        sqlserver:
            condition: service_healthy
    volumes:
        - ./migrations:/migrations
    networks:
        - internal
    command: >
        /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U SA -P '${SQLSERVER_SA_PASSWORD}' -i /migrations/init_db.sql -v DB_NAME='${SETUPS_DB_NAME}' -v MIGRATOR_USER='${SETUPS_USER_MIGRATOR}' -v MIGRATOR_PASSWORD='${SETUPS_PASSWORD_MIGRATOR}' -v APPLICATION_USER='${SETUPS_USER_APPLICATION}' -v APPLICATION_PASSWORD='${SETUPS_PASSWORD_APPLICATION}' -C"